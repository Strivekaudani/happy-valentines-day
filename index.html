<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Valentine</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Manrope:wght@400;600;700&display=swap");

    :root {
      --rose-100: #fff1f5;
      --rose-200: #ffd9e6;
      --rose-300: #ffb8cf;
      --rose-500: #ff5f8f;
      --rose-700: #c72b63;
      --wine: #4e1e35;
      --cream: #fff8f2;
      --ink: #2a1720;
      --shadow: 0 14px 40px rgba(78, 30, 53, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, #ffe6ef 0%, transparent 35%),
        radial-gradient(circle at 90% 20%, #ffdce9 0%, transparent 36%),
        linear-gradient(135deg, #fff7fb 0%, #ffe9f1 52%, #ffe0ed 100%);
      overflow-x: hidden;
    }

    .hearts {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -3rem;
      width: 14px;
      height: 14px;
      background: var(--rose-500);
      transform: rotate(45deg);
      opacity: 0;
      animation: floatUp linear forwards;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      background: inherit;
      border-radius: 50%;
    }

    .heart::before { left: -7px; }
    .heart::after { top: -7px; }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) rotate(45deg) scale(0.85); }
      15% { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(-110vh) rotate(45deg) scale(1.25); }
    }

    .wrap {
      width: min(960px, 92%);
      margin: 0 auto;
      position: relative;
      z-index: 1;
      padding: 2.2rem 0 3rem;
    }

    .hero {
      text-align: center;
      padding: 2rem 1rem 1.2rem;
      animation: fadeUp 1s ease forwards;
      opacity: 0;
    }

    .hero h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1.08;
      color: var(--wine);
      letter-spacing: 0.02em;
      margin-bottom: 0.7rem;
    }

    .hero p {
      max-width: 640px;
      margin: 0 auto;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: #643547;
    }

    .letter-card {
      margin-top: 1.6rem;
      background: linear-gradient(155deg, #fffdfd 0%, var(--cream) 100%);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translateY(18px);
      opacity: 0;
      animation: fadeUp 1s 0.25s ease forwards;
    }

    .card-top {
      background: linear-gradient(135deg, var(--rose-700), var(--rose-500));
      color: white;
      padding: 1.1rem 1.2rem;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .card-body {
      padding: 1.4rem 1.2rem 1.6rem;
    }

    .lines {
      display: grid;
      gap: 0.85rem;
      margin: 0.8rem 0 1rem;
    }

    .line {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 500ms ease, transform 500ms ease;
      color: #472432;
    }

    .line.show {
      opacity: 1;
      transform: translateY(0);
    }

    .controls {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 0.72rem 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 250ms ease, background 250ms ease;
    }

    .primary {
      background: var(--rose-500);
      color: #fff;
      box-shadow: 0 6px 16px rgba(199, 43, 99, 0.3);
    }

    .secondary {
      background: #ffe0ec;
      color: var(--wine);
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .promise {
      margin-top: 1.4rem;
      border: 1px solid #ffd7e4;
      border-radius: 16px;
      padding: 1rem;
      background: #fff6fa;
      transform: scale(0.98);
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 420ms ease, opacity 420ms ease, transform 420ms ease, padding 420ms ease;
    }

    .promise.open {
      max-height: 220px;
      opacity: 1;
      transform: scale(1);
      padding: 1rem;
    }

    .promise h2 {
      font-family: "Playfair Display", serif;
      color: var(--wine);
      margin-bottom: 0.4rem;
      font-size: 1.35rem;
    }

    .footer-note {
      text-align: center;
      color: #6d3c50;
      margin-top: 1.5rem;
      font-size: 0.95rem;
      opacity: 0;
      animation: fadeUp 1s 0.5s ease forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 760px) {
      .card-body { padding: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="wrap">
    <section class="hero">
      <h1>Happy Valentine&apos;s Day, My Love</h1>
      <p>
        This little page is for you. Every click is a reminder that you are my favorite part of every day.
      </p>
    </section>

    <section class="letter-card">
      <div class="card-top">A Note For Her</div>
      <div class="card-body">
        <p id="intro">Click below and I&apos;ll reveal what&apos;s on my heart.</p>
        <div class="lines" id="lines"></div>
        <div class="controls">
          <button class="primary" id="revealBtn">Reveal Message</button>
          <button class="secondary" id="surpriseBtn">Send More Love</button>
        </div>
        <div class="promise" id="promise">
          <h2>My Promise</h2>
          <p>I will keep choosing you, celebrating you, and building beautiful days with you.</p>
        </div>
      </div>
    </section>

    <p class="footer-note" id="dateLine"></p>
  </main>

  <script>
    const messageLines = [
      "You make ordinary moments feel magical.",
      "Your smile is my favorite view.",
      "Loving you is the easiest choice I have ever made.",
      "Thank you for being my safe place and my adventure."
    ];

    const linesEl = document.getElementById("lines");
    const revealBtn = document.getElementById("revealBtn");
    const surpriseBtn = document.getElementById("surpriseBtn");
    const promise = document.getElementById("promise");
    const hearts = document.getElementById("hearts");
    const dateLine = document.getElementById("dateLine");

    let shown = 0;
    let heartTimer;

    function addHeart() {
      const h = document.createElement("span");
      h.className = "heart";
      h.style.left = Math.random() * 100 + "vw";
      h.style.animationDuration = 3 + Math.random() * 3 + "s";
      h.style.background = Math.random() > 0.5 ? "#ff5f8f" : "#ff7aa5";
      hearts.appendChild(h);
      setTimeout(() => h.remove(), 6200);
    }

    function burstHearts(count = 18) {
      for (let i = 0; i < count; i++) {
        setTimeout(addHeart, i * 110);
      }
    }

    revealBtn.addEventListener("click", () => {
      if (shown < messageLines.length) {
        const p = document.createElement("p");
        p.className = "line";
        p.textContent = messageLines[shown];
        linesEl.appendChild(p);
        requestAnimationFrame(() => p.classList.add("show"));
        shown += 1;
      } else {
        promise.classList.add("open");
      }
      burstHearts(8);
      revealBtn.textContent = shown < messageLines.length ? "Reveal More" : "Open My Promise";
    });

    surpriseBtn.addEventListener("click", () => {
      promise.classList.add("open");
      burstHearts(28);
      clearInterval(heartTimer);
      heartTimer = setInterval(addHeart, 650);
      setTimeout(() => clearInterval(heartTimer), 4000);
    });

    const today = new Date();
    dateLine.textContent = `Made with love for you on ${today.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    })}.`;

    setTimeout(() => burstHearts(12), 400);
  </script>
</body>
</html>
